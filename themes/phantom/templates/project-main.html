					<section data-se="section blocks" data-se-role="project">
						<h1>{{title}}</h1>
						<p>{{text}}</p>
						<span class="image main"><img src="{{image}}" alt="{{title}}" /></span>
<!--se:if github-->						<ul class="actions">
							<li><a href="{{github}}" class="button primary icon brands fa-github">Code on GitHub</a></li>
						</ul>
<!--/se:if-->					</section>
					<section class="post" data-se="section blocks" data-se-type="post">
						<h2>First blog post</h2>
						<p class="date">{{date}}</p>
						<p>What you did, what worked and what did not. Click this text to change it. Use + New blog post to add the next one: the newest post goes on top, and its date becomes the date on the project's tile on the home page.</p>
					</section>
