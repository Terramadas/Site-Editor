				<section class="post" data-se="section blocks">
					<header class="major">
						<span class="date">{{date}}</span>
						<h1>{{title}}</h1>
						<p>{{text}}</p>
					</header>
					<div class="image main"><img src="{{image}}" alt="{{title}}" /></div>
					<h2>What it does</h2>
					<p>Describe the project: what problem it solves and how it works.</p>
					<h2>Parts</h2>
					<ul>
						<li>First part</li>
						<li>Second part</li>
					</ul>
					<h2>How I built it</h2>
					<p>The steps, the mistakes and what you would do differently.</p>

						<li><a href="{{github}}" class="button large icon brands fa-github">Code on GitHub</a></li>
					</ul>
<!--/se:if-->				</section>
